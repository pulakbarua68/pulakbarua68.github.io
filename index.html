
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BKF ULTRA 2027 GOD</title><style>body{margin:0;background:#050510;color:#fff;font-family:sans-serif}.header{height:60px;background:linear-gradient(90deg,#ff0040,#7000ff);display:flex;align-items:center;justify-content:space-between;padding:0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.card{background:#1a1a2e;border:1px solid #333;border-radius:16px;padding:20px;text-align:center;cursor:pointer}.card:active{background:#ff0040}#game{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0a3d0a;display:none;align-items:center;justify-content:flex-start;flex-direction:column;z-index:999;overflow-y:auto;padding:20px}</style></head><body>
<div class="header"><b>BKF ULTRA 2027</b><span id="bid" style="font-size:10px;background:gold;color:black;padding:4px 8px;border-radius:10px"></span></div>
<div class="grid" id="mainGrid">
<div class="card" onclick="go('quick')">⚡ QUICK MATCH</div>
<div class="card" onclick="go('friendly')">🤝 FRIENDLY</div>
<div class="card" onclick="go('tournament')">🏆 ALL TOURNAMENT</div>
<div class="card" onclick="go('cards')">🃏 PLAYER CARD</div>
<div class="card" onclick="go('stadium')">🏟️ STADIUM</div>
<div class="card" onclick="go('god')" style="border:2px solid gold">🔴 GOD UPDATE<br><small>CAMERA</small></div>
</div>
<div id="game"><h1 id="gTitle"></h1><button onclick="document.getElementById('game').style.display='none'" style="padding:12px 25px;margin-top:15px;border-radius:10px">BACK</button><div id="gBody" style="margin-top:15px;text-align:center;width:95vw"></div></div>
<script>
let id=localStorage.getItem("bkf_id")||"BKF-ASIF-"+Math.floor(Math.random()*9000);localStorage.setItem("bkf_id",id);document.getElementById("bid").innerText=id;
let savedList=JSON.parse(localStorage.getItem("bkf_god_list")||"[]");
savedList.forEach(function(t){let c=document.createElement("div");c.className="card";c.style.border="2px solid #0f0";c.innerHTML="✅ "+t+"<br><small>ADDED BY GOD</small>";c.onclick=function(){go("cards")};document.getElementById("mainGrid").appendChild(c);});
function go(type){
let g=document.getElementById("game");g.style.display="flex";let title=document.getElementById("gTitle");let body=document.getElementById("gBody");
if(type=="quick"){title.innerText="⚡ QUICK MATCH";body.innerHTML="Game Ready!";}
else if(type=="friendly"){title.innerText="🤝 FRIENDLY";body.innerHTML="Friend ID Ready!";}
else if(type=="tournament"){title.innerText="🏆 TOURNAMENT";body.innerHTML="9 Trophies Ready!";}
else if(type=="cards"){title.innerText="🃏 CARDS";body.innerHTML="118 Rating Ready!";}
else if(type=="stadium"){title.innerText="🏟️ STADIUM";body.innerHTML="Lusail Ready!";}
else if(type=="god"){
if(id.indexOf("ASIF")==-1 && localStorage.getItem("isOwner")!="true"){let c=prompt("GOD Only Owner - 777 লেখো");if(c=="777"){localStorage.setItem("isOwner","true");}else{alert("Only Owner!");g.style.display="none";return;}}
title.innerText="🔴 GOD CONSOLE";
let img=localStorage.getItem("bkf_god_img")||"";
let listHtml="";
for(let i=0;i<savedList.length;i++){listHtml+="<div style='background:#111;padding:8px;margin:5px;border-radius:8px;border-left:3px solid #0f0'>✅ "+savedList[i]+"</div>";}
body.innerHTML="<textarea id='godIn' style='width:90vw;height:80px;background:#000;color:#0f0;border:1px solid red;border-radius:8px;padding:8px' placeholder='যেমন: Messi 120'></textarea><br><div style='display:flex;gap:10px;margin-top:10px;justify-content:center'><button id='camBtn' style='padding:10px;background:gold;border:none;border-radius:8px'>+ 📷 CAMERA / GALLERY</button><button id='applyBtn' style='padding:10px;background:red;color:white;border:none;border-radius:8px'>🚀 APPLY 100%</button></div><input type='file' id='fileIn' accept='image/*' style='display:none'><img id='prev' src='"+img+"' style='max-width:90vw;max-height:150px;margin-top:10px;"+(img?"display:block":"display:none")+";border-radius:10px'><div id='godList' style='margin-top:15px;text-align:left'>"+listHtml+"</div>";

document.getElementById("camBtn").onclick=function(){document.getElementById("fileIn").click();};
document.getElementById("applyBtn").onclick=function(){
let text=document.getElementById("godIn").value;if(!text){alert("কিছু লেখো!");return;}
savedList.push(text);localStorage.setItem("bkf_god_list",JSON.stringify(savedList));
let newCard=document.createElement("div");newCard.className="card";newCard.style.border="2px solid #0f0";newCard.innerHTML="✅ "+text+"<br><small>ADDED BY GOD</small>";newCard.onclick=function(){go("cards")};document.getElementById("mainGrid").appendChild(newCard);
let div=document.createElement("div");div.style.cssText="background:#111;padding:8px;margin:5px;border-radius:8px;border-left:3px solid #0f0";div.innerText="✅ "+text+" Added!";document.getElementById("godList").appendChild(div);
document.getElementById("godIn").value="";alert("✅ ADD হয়ে গেছে! HOME এ দেখো!");
};
document.getElementById("fileIn").onchange=function(e){let r=new FileReader();r.onload=function(ev){let p=document.getElementById("prev");p.src=ev.target.result;p.style.display="block";localStorage.setItem("bkf_god_img",ev.target.result);};r.readAsDataURL(e.target.files[0]);};
}
}
</script>
</body></html>
