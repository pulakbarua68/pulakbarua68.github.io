<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BKF eFootball ULTRA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
body{background:#000;height:100vh;overflow:hidden;font-family:Arial,sans-serif}
#wrap{position:relative;width:100%;height:100vh;background:#0a1628;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.top-bar{position:absolute;top:0;left:0;right:0;height:56px;background:#0e1f3f;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:20;border-bottom:3px solid #facc15}
.btn{background:#fff;border-radius:10px;width:48px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.ad{position:absolute;top:56px;left:0;right:0;height:22px;background:linear-gradient(90deg,#ff00ff,#00eaff,#ff00ff);z-index:15;display:flex;align-items:center;overflow:hidden;color:#fff;font-weight:900;font-size:12px}
.ad span{animation:marq 8s linear infinite;white-space:nowrap}
@keyframes marq{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.hud{position:absolute;top:86px;left:10px;right:10px;background:rgba(0,0,0,0.9);border:1px solid #facc15;border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;color:#facc15;font-size:12px;font-weight:800;z-index:15}
#goalPop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(180deg,#ffeb3b,#facc15);color:#000;font-size:54px;font-weight:900;padding:10px 32px;border-radius:18px;z-index:100;transition:0.5s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 0 50px #facc15;pointer-events:none;text-shadow:0 2px 0 #fff}
#goalPop.show{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
.btm{position:absolute;bottom:0;left:0;right:0;height:180px;background:linear-gradient(0deg,rgba(0,0,0,0.98) 60%,transparent);display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 12px;z-index:15}
.joy{width:130px;height:130px;background:radial-gradient(circle,rgba(255,255,255,0.15),rgba(255,255,255,0.05));border:2px solid rgba(255,255,255,0.25);border-radius:50%;position:relative;backdrop-filter:blur(8px)}
.stick{position:absolute;left:50%;top:50%;width:58px;height:58px;background:radial-gradient(circle at 30% 30%,#fff,#ddd);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 5px 18px rgba(0,0,0,0.7),inset 0 2px 4px #fff}
.grid{display:grid;grid-template-columns:76px 76px;gap:14px}
.b{width:76px;height:76px;border-radius:50%;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px;box-shadow:0 6px 20px rgba(0,0,0,0.7)}
.b:active{transform:scale(0.92)}.b b{font-size:24px}
.b1{background:linear-gradient(180deg,#b18cff,#6d28d9)}.b2{background:linear-gradient(180deg,#5cc8ff,#0277bd)}
.b3{background:linear-gradient(180deg,#69f0a0,#2e7d32)}.b4{background:linear-gradient(180deg,#ffb74d,#e65100)}
</style>
</head>
<body>
<div id="wrap">
<div class="top-bar"><div style="color:#facc15;font-weight:900">⚽ BKF</div><div style="display:flex;gap:8px"><div class="btn">⏮️</div><div class="btn">⏸️</div></div></div>
<div class="ad"><span>⚽ PLAY CRAZY @FOOTBALL ⚽ eFOOTBALL 2025 - BKF ULTRA ⚽ PLAY CRAZY @FOOTBALL ⚽</span></div>
<canvas id="c"></canvas>
<div id="goalPop">GOOOAL!!!</div>
<div class="hud"><span>💰 101499</span><span style="color:#4ade80">OVR 99</span><span style="color:#a78bfa">LVL 99</span><span id="sc">BAN 1-1 BRA</span></div>
<div class="btm">
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="grid">
<div class="b b1" id="btn1">BICYCLE<b>🤸</b></div>
<div class="b b2" id="btn2">SPRINT<b>💨</b></div>
<div class="b b3" id="btn3">PASS<b>↗️</b></div>
<div class="b b4" id="btn4">SHOOT<b>⚽</b></div>
</div>
</div>
</div>
<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');let W,H;
function rs(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}rs();addEventListener('resize',rs);
let players=[];let sA=1,sB=1;let ball={x:W/2,y:H/2,vx:0,vy:0};let sel=0;
let actx;function beep(f,d,v=0.3){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();let o=actx.createOscillator();let g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.value=v;o.start();g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+d);o.stop(actx.currentTime+d)}catch(e){}}
for(let i=0;i<11;i++)players.push({team:'A',num:[1,2,5,4,3,6,8,10,7,11,9][i],x:W*0.08+Math.random()*W*0.28,y:90+Math.random()*(H-280),spd:1.2});
for(let i=0;i<11;i++)players.push({team:'B',num:[1,2,5,4,3,6,8,10,7,11,9][i],x:W*0.58+Math.random()*W*0.3,y:90+Math.random()*(H-280),spd:1.0});
function field(){
ctx.fillStyle='#2e8b4e';ctx.fillRect(0,78,W,H);
for(let i=0;i<W;i+=68){ctx.fillStyle=i%136==0?'#33a05a':'#278a4a';ctx.fillRect(i,78,68,H-78)}
ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=2.8;ctx.strokeRect(W*0.015,90,W*0.97,H-90-182);
ctx.beginPath();ctx.moveTo(W/2,90);ctx.lineTo(W/2,H-182);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,(H-92)/2,88,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,(H-92)/2,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
ctx.lineWidth=3.5;ctx.strokeRect(0,(H-92)/2-52,W*0.09,104);ctx.strokeRect(W-W*0.09,(H-92)/2-52,W*0.09,104);
ctx.fillStyle='#fff';ctx.fillRect(0,(H-92)/2-52,6,104);ctx.fillRect(W-6,(H-92)/2-52,6,104);
}
function draw(){
field();
ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+9,12,5,0,0,Math.PI*2);ctx.fill();
players.forEach((p,i)=>{
ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(p.x,p.y+12,11,5,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=p.team=='A'?'#ffeb3b':'#e53935';ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill();
ctx.fillStyle=p.team=='A'?'#1e3a8a':'#fff';ctx.fillRect(p.x-7,p.y-10,14,11);
ctx.fillStyle=p.team=='A'?'#fff':'#000';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(p.num,p.x,p.y-1);
if(i==sel){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,19,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffeb3b';ctx.setLineDash([4,4]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,25,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
});
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,8.5,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.stroke();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ball.x-1.5,ball.y-1,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x+2,ball.y+2,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x,ball.y+3.5,1.5,0,Math.PI*2);ctx.fill();
requestAnimationFrame(draw)
}draw();
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let drag=false,ang=0,pow=0;
joy.addEventListener('touchstart',e=>{drag=true;beep(300,0.08,0.1)});joy.addEventListener('touchend',e=>{drag=false;stick.style.transform='translate(-50%,-50%)';pow=0});
joy.addEventListener('touchmove',e=>{
if(!drag)return;e.preventDefault();
let r=joy.getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;
let dx=e.touches[0].clientX-cx,dy=e.touches[0].clientY-cy;pow=Math.min(46,Math.hypot(dx,dy));ang=Math.atan2(dy,dx);
stick.style.transform=`translate(calc(-50% + ${Math.cos(ang)*pow}px), calc(-50% + ${Math.sin(ang)*pow}px))`;
let spd=(pow/46)*3.5;players[sel].x+=Math.cos(ang)*spd;players[sel].y+=Math.sin(ang)*spd;
players[sel].x=Math.max(14,Math.min(W-14,players[sel].x));players[sel].y=Math.max(92,Math.min(H-188,players[sel].y));
let bd=Math.hypot(ball.x-players[sel].x,ball.y-players[sel].y);if(bd<26){ball.x+=Math.cos(ang)*spd*0.9;ball.y+=Math.sin(ang)*spd*0.9}
},{passive:false});
canvas.addEventListener('touchstart',e=>{
let c=0,d=9999;players.forEach((p,i)=>{if(p.team!='A')return;let dist=Math.hypot(p.x-e.touches[0].clientX,p.y-e.touches[0].clientY);if(dist<d){d=dist;c=i}});if(d<70){sel=c;beep(600,0.1,0.2)}
});
function shoot(power=1){
beep(200,0.3,0.4);
let dir= W*0.95 - ball.x; ball.vx=dir*0.08*power + (Math.random()-0.5)*2; ball.vy=(Math.random()-0.5)*6*power;
let it=setInterval(()=>{ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.993;ball.vy*=0.99;check();if(ball.x<0||ball.x>W||ball.y<78||ball.y>H-180){clearInterval(it)}},16)
}
document.getElementById('btn4').addEventListener('touchstart',()=>shoot(1.3));
document.getElementById('btn3').addEventListener('touchstart',()=>{
beep(500,0.12,0.2);
let t=players.filter(p=>p.team=='A'&&p!=players[sel]).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];
if(t){ball.vx=(t.x-ball.x)*0.14;ball.vy=(t.y-ball.y)*0.14;let it=setInterval(()=>{ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.96;ball.vy*=0.96;check();if(Math.hypot(ball.vx,ball.vy)<0.8)clearInterval(it)},16)}
});
document.getElementById('btn2').addEventListener('touchstart',()=>{beep(800,0.15,0.2);let old=players[sel].spd;players[sel].spd=3;setTimeout(()=>players[sel].spd=old,900)});
document.getElementById('btn1').addEventListener('touchstart',()=>{beep(400,0.4,0.3);shoot(0.6);players[sel].y-=18;setTimeout(()=>players[sel].y+=18,200)});
function check(){let gy=(H-92)/2;if(ball.y>gy-52&&ball.y<gy+52){if(ball.x<=8){sB++;goal()}if(ball.x>=W-8){sA++;goal()}}}
function goal(){
let pop=document.getElementById('goalPop');pop.classList.add('show');document.getElementById('sc').innerText=`BAN ${sA}-${sB} BRA`;
beep(300,0.2,0.5);setTimeout(()=>beep(500,0.3,0.5),150);setTimeout(()=>beep(800,0.6,0.6),300);
if(navigator.vibrate)navigator.vibrate([100,50,150,50,300]);
setTimeout(()=>{pop.classList.remove('show');ball.x=W/2;ball.y=(H-92)/2;ball.vx=0;ball.vy=0},2000)
}
setInterval(()=>{
players.forEach((p,i)=>{
if(p.team=='B'){
let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
if(d<260){p.x+=dx*0.018*p.spd;p.y+=dy*0.018*p.spd;if(d<20){ball.x+=dx*0.18;ball.y+=dy*0.18;if(Math.random()<0.04)shoot(0.8)}}
}
})
},28);
</script>
</body>
</html>
