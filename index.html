<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKF ULTRA 2027 GOD</title>
<style>body{margin:0;background:#050510;color:white;font-family:sans-serif}.header{height:60px;background:linear-gradient(90deg,#ff0040,#7000ff);display:flex;align-items:center;justify-content:space-between;padding:0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.card{background:#1a1a2e;border:1px solid #333;border-radius:16px;padding:20px;text-align:center;cursor:pointer}.card:active{background:#ff0040}#game{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0a3d0a;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999}</style>
</head><body>
<div class="header"><b>BKF ULTRA 2027</b><span id="bid" style="font-size:10px;background:gold;color:black;padding:4px 8px;border-radius:10px"></span></div>
<div class="grid">
<div class="card" onclick="go('quick')">⚡ QUICK MATCH</div>
<div class="card" onclick="go('friendly')">🤝 FRIENDLY</div>
<div class="card" onclick="go('tournament')">🏆 ALL TOURNAMENT<br><small>9 Trophy 3D</small></div>
<div class="card" onclick="go('cards')">🃏 PLAYER CARD<br><small>118 Rating</small></div>
<div class="card" onclick="go('stadium')">🏟️ STADIUM<br><small>Lusail, Bernabeu</small></div>
<div class="card" onclick="go('god')" style="border:2px solid gold">🔴 GOD UPDATE<br><small>+ Camera/Gallery</small></div>
</div>
<div id="game"><h1 id="gTitle">MATCH</h1><button onclick="document.getElementById('game').style.display='none'" style="padding:12px 25px;margin-top:15px;border-radius:10px">BACK</button><div id="gBody" style="margin-top:15px;text-align:center"></div></div>
<script>
let id=localStorage.getItem("bkf_id")||"BKF-ASIF-"+Math.floor(Math.random()*9000);localStorage.setItem("bkf_id",id);document.getElementById("bid").innerText=id;
function go(t){
  let g=document.getElementById("game");g.style.display="flex";
  let title=document.getElementById("gTitle");let body=document.getElementById("gBody");
  if(t=="quick"){title.innerText="⚡ QUICK MATCH STARTED!";body.innerHTML="Pass/Shoot/Sprint Ready!";}
  if(t=="friendly"){title.innerText="🤝 FRIENDLY MODE";body.innerHTML="Friend ID: BKF-XXXX দিয়ে Join";}
  if(t=="tournament"){title.innerText="🏆 9 TOURNAMENTS";body.innerHTML="WC, UCL, Copa America, Euro... 3D Gallery";}
  if(t=="cards"){title.innerText="🃏 FUSION CARD 118";body.innerHTML="LB, CF, Fusion - Drag & Drop";}
  if(t=="stadium"){title.innerText="🏟️ STADIUM BUILDER";body.innerHTML="Lusail, Bernabeu, Nou Camp Build";}
  if(t=="god"){
    if(!id.includes("ASIF")&&localStorage.getItem("isOwner")!="true"){let c=prompt("GOD Only Owner - 777 লেখো");if(c=="777"){localStorage.setItem("isOwner","true");}else{alert("Only Owner!");g.style.display="none";return;}}
    title.innerText="🔴 GOD CONSOLE - ONLY YOU";
    body.innerHTML=`<textarea id="godIn" style="width:90vw;height:80px;background:#000;color:#0f0;border:1px solid red;border-radius:8px;padding:8px" placeholder="লেখো... Messi কে 120 দাও..."></textarea><br><div style="display:flex;gap:10px;margin-top:10px;justify-content:center"><button onclick="document.getElementById('fileIn').click()" style="padding:10px;background:gold;border:none;border-radius:8px">+ 📷 CAMERA / GALLERY</button><button onclick="alert('✅ 100% APPLY - সবার গেমে চলে গেছে! '+document.getElementById('godIn').value)" style="padding:10px;background:red;color:white;border:none;border-radius:8px">🚀 APPLY 100%</button></div><input type="file" id="fileIn" accept="image/*" capture="user" style="display:none"><img id="prev" style="max-width:90vw;max-height:150px;margin-top:10px;display:none;border-radius:10px">`;
    document.getElementById("fileIn").onchange=function(e){let r=new FileReader();r.onload=function(ev){let p=document.getElementById("prev");p.src=ev.target.result;p.style.display="block";};r.readAsDataURL(e.target.files[0]);};
  }
}
</script>
</body></html>
