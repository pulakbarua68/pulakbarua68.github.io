
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BKF ULTRA 2026 - FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
body{background:#000;height:100vh;overflow:hidden;font-family:Arial}
#wrap{position:relative;width:100%;height:100vh;background:#0a1628;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1}
#mainMenu{position:absolute;left:0;top:0;width:100%;height:100%;z-index:100;background:radial-gradient(circle at top,#1e3a8a,#000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#mainMenu.hide{display:none}
.logo{font-size:52px;font-weight:900;color:#facc15;text-shadow:0 0 20px #facc15}
.sublogo{color:#fff;font-size:14px;letter-spacing:6px;font-weight:800;margin:6px 0 26px}
.menuBtn{width:300px;padding:18px;background:#facc15;color:#000;font-weight:900;font-size:18px;border-radius:16px;border:3px solid #fff;margin:10px 0;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.menuBtn:active{transform:scale(0.96)}
.menuBtn.sec{background:#1e293b;color:#fff}
#squadScreen{position:absolute;left:0;top:0;width:100%;height:100%;z-index:90;background:#0a0e1a;display:none;flex-direction:row}
#squadScreen.show{display:flex}
.squadLeft{width:84px;background:#060a14;display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:12px;border-right:2px solid #1e293b;z-index:95}
.squadCenter{flex:1;position:relative;background:radial-gradient(circle at center,#1a3a1a,#081208 100%);overflow:hidden;z-index:92}
.squadRight{width:118px;background:#060a14;padding:12px 8px;display:flex;flex-direction:column;gap:10px;border-left:2px solid #1e293b;z-index:95}
.backBtn{width:100%;background:#0ea5e9;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:900;margin-top:auto;cursor:pointer}
.pCard{position:absolute;width:70px;height:84px;background:linear-gradient(180deg,#2a2f3a,#0f141e);border:2px solid #d4af37;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:4px;cursor:pointer;z-index:93}
.pCard.selected{transform:scale(1.18);border-color:#00eaff;box-shadow:0 0 22px #00eaff}
.bench{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,0.97);border-top:3px solid #facc15;padding:10px;display:none;gap:8px;overflow-x:auto;z-index:96}
.bench.show{display:flex}
#updateBtn{position:absolute;right:12px;bottom:20px;z-index:110;background:#00eaff;color:#000;font-weight:900;padding:12px 20px;border-radius:30px;border:3px solid #fff;cursor:pointer}
#chatBox{position:absolute;right:10px;bottom:70px;width:320px;max-width:94%;background:#0f172a;border:2px solid #facc15;border-radius:18px;z-index:120;display:none;flex-direction:column;overflow:hidden}
#chatBox.show{display:flex}
.chatHead{background:#facc15;color:#000;font-weight:900;padding:12px;display:flex;justify-content:space-between}
.chatBody{padding:12px;max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{background:#1e293b;color:#fff;padding:8px 12px;border-radius:12px;font-size:13px}
.msg.me{background:#facc15;color:#000;align-self:flex-end}
.chatInput{display:flex;gap:6px;padding:10px;background:#020617}
.chatInput input{flex:1;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff}
.chatInput button{background:#facc15;border:none;padding:0 18px;border-radius:12px;font-weight:900}
#gameUI{position:absolute;left:0;top:0;width:100%;height:100%;z-index:10;display:none}
#gameUI.show{display:block}
.top{position:absolute;top:0;left:0;right:0;height:54px;background:#0e1f3f;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:3px solid #facc15}
.btm{position:absolute;bottom:0;left:0;right:0;height:170px;background:linear-gradient(0deg,#000 70%,transparent);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px 12px}
.joy{width:120px;height:120px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:50%;position:relative}
.stick{position:absolute;left:50%;top:50%;width:54px;height:54px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.grid{display:grid;grid-template-columns:70px 70px;gap:12px}
.b{width:70px;height:70px;border-radius:50%;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:10px}
.b3{background:#16a34a}.b4{background:#ea580c}
.pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);background:#facc15;color:#000;font-size:30px;font-weight:900;padding:10px 22px;border-radius:14px;z-index:150;transition:0.3s}
.pop.show{transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="wrap">
<div id="mainMenu">
<div class="logo">BKF ULTRA</div>
<div class="sublogo">eFOOTBALL 2026</div>
<div class="menuBtn" id="btnSquad">🧩 MY SQUAD - PLAYER CARD</div>
<div class="menuBtn" id="btnKick">▶️ KICK OFF</div>
<div class="menuBtn sec" id="btnUpdateMenu">⚡ UPDATE SYSTEM</div>
<div style="color:rgba(255,255,255,0.4);font-size:11px;margin-top:16px">v3.1 FIXED - ALL BUTTONS WORK</div>
</div>

<div id="squadScreen">
<div class="squadLeft">
<div style="width:64px;height:64px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px">🧔</div>
<div style="width:62px;height:62px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center">🇧🇩</div>
<div class="backBtn" id="squadBack">◀ Back</div>
</div>
<div class="squadCenter" id="squadCenter"><div class="bench" id="bench"></div></div>
<div class="squadRight">
<div style="color:#9ca3af;font-size:11px;text-align:right">Collective Strength <b id="csVal" style="color:#facc15;font-size:28px;display:block">3200</b></div>
<div class="menuBtn sec" style="width:100%;padding:10px;font-size:13px" id="toGameFromSquad">▶️ PLAY</div>
</div>
</div>

<canvas id="c"></canvas>

<div id="gameUI">
<div class="top"><div class="menuBtn sec" style="width:auto;padding:8px 16px;margin:0" id="homeBtn">🏠 HOME</div><div style="color:#facc15;font-weight:900" id="sc">BAN 0-0 BRA</div></div>
<div class="btm"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="grid"><div class="b b3" id="pass">PASS</div><div class="b b4" id="shoot">SHOOT</div></div></div>
</div>

<div class="pop" id="goalPop">GOOOAL!!!</div>
<div class="pop" id="throwPop" style="background:#fff;color:#e11d48">THROW-IN</div>
<div id="updateBtn">⚡ UPDATE</div>
<div id="chatBox"><div class="chatHead"><span>⚡ UPDATE CHAT</span><span id="chatClose" style="cursor:pointer">✕</span></div><div class="chatBody" id="chatBody"><div class="msg">এখানে লিখো কি Add করতে চাও - 5 সেকেন্ডে Add হবে!</div></div><div class="chatInput"><input id="chatInput" placeholder="Add Messi..."><button id="chatSend">ADD</button></div></div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function R(){W=cv.width=innerWidth;H=cv.height=innerHeight}R();addEventListener('resize',R);
let sA=0,sB=0,sel=0,gameStarted=false,paused=false;let ball={x:W/2,y:H/2,vx:0,vy:0};
let squad=[{id:0,pos:'CF',rat:105,name:'Drogba',flag:'🇨🇮',icon:'👑',x:0.38,y:0.18},{id:1,pos:'CF',rat:101,name:'Mbappe',flag:'🇫🇷',icon:'🐢',x:0.62,y:0.18},{id:2,pos:'AMF',rat:104,name:'Griez',flag:'🇫🇷',icon:'🤓',x:0.28,y:0.38},{id:3,pos:'AMF',rat:104,name:'Kaka',flag:'🇧🇷',icon:'😇',x:0.72,y:0.38},{id:4,pos:'CMF',rat:102,name:'Rice',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',icon:'🦁',x:0.38,y:0.54},{id:5,pos:'DMF',rat:101,name:'Tchou',flag:'🇫🇷',icon:'💪',x:0.62,y:0.54},{id:6,pos:'LB',rat:101,name:'Maldini',flag:'🇮🇹',icon:'🛡️',x:0.15,y:0.74},{id:7,pos:'CB',rat:106,name:'Maldini',flag:'🇮🇹',icon:'🧱',x:0.38,y:0.78},{id:8,pos:'CB',rat:105,name:'Canna',flag:'🇮🇹',icon:'🔥',x:0.62,y:0.78},{id:9,pos:'RB',rat:101,name:'White',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',icon:'⚡',x:0.85,y:0.74},{id:10,pos:'GK',rat:104,name:'Cech',flag:'🇨🇿',icon:'🧤',x:0.5,y:0.92}];
let bench=[{pos:'CF',rat:99,name:'Haaland',flag:'🇳🇴',icon:'🤖'},{pos:'CF',rat:98,name:'Neymar',flag:'🇧🇷',icon:'🎩'},{pos:'AMF',rat:100,name:'Messi',flag:'🇦🇷',icon:'🐐'},{pos:'CMF',rat:97,name:'Belling',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',icon:'🌟'},{pos:'CB',rat:98,name:'VanDijk',flag:'🇳🇱',icon:'🏔️'}];
let selectedCard=null;const squadCenter=document.getElementById('squadCenter');
function renderSquad(){squadCenter.querySelectorAll('.pCard').forEach(e=>{if(!e.classList.contains('benchCard'))e.remove()});squad.forEach(p=>{let d=document.createElement('div');d.className='pCard';d.style.left=(p.x*100-35)+'px';d.style.top=(p.y*100-10)+'px';d.innerHTML=`<div style="font-size:11px;font-weight:900;color:#4ade80">${p.pos}</div><div style="font-size:15px;font-weight:900;color:#fff">${p.rat}</div><div style="width:52px;height:38px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:2px">${p.icon}</div><div style="font-size:10px">${p.flag}</div>`;d.addEventListener('click',()=>selectCard(p.id,d));d.addEventListener('touchstart',(e)=>{e.preventDefault();selectCard(p.id,d)});squadCenter.appendChild(d);});let benchDiv=document.getElementById('bench');benchDiv.innerHTML='';bench.forEach((p,i)=>{let d=document.createElement('div');d.className='pCard benchCard';d.style.position='relative';d.style.left='0';d.style.top='0';d.innerHTML=`<div style="font-size:11px;font-weight:900;color:#4ade80">${p.pos}</div><div style="font-size:15px;font-weight:900;color:#fff">${p.rat}</div><div style="width:52px;height:38px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px">${p.icon}</div>`;d.addEventListener('click',()=>doSub(i));d.addEventListener('touchstart',(e)=>{e.preventDefault();doSub(i)});benchDiv.appendChild(d);});}
function selectCard(id,el){document.querySelectorAll('.pCard').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');selectedCard=id;document.getElementById('bench').classList.add('show');}
function doSub(idx){if(selectedCard===null)return;let b=bench[idx];let s=squad[selectedCard];bench[idx]={pos:s.pos,rat:s.rat,name:s.name,flag:s.flag,icon:s.icon};s.pos=b.pos;s.rat=b.rat;s.name=b.name;s.flag=b.flag;s.icon=b.icon;selectedCard=null;document.getElementById('bench').classList.remove('show');renderSquad();}
renderSquad();
function openSquad(){document.getElementById('mainMenu').classList.add('hide');document.getElementById('squadScreen').classList.add('show');}
function closeSquad(){document.getElementById('squadScreen').classList.remove('show');document.getElementById('mainMenu').classList.remove('hide');}
function startGame(){document.getElementById('mainMenu').classList.add('hide');document.getElementById('squadScreen').classList.remove('show');document.getElementById('gameUI').classList.add('show');gameStarted=true;resetPos();}
function goHome(){gameStarted=false;document.getElementById('gameUI').classList.remove('show');document.getElementById('mainMenu').classList.remove('hide');}
document.getElementById('btnSquad').addEventListener('click',openSquad);document.getElementById('btnSquad').addEventListener('touchstart',function(e){e.preventDefault();openSquad();});
document.getElementById('squadBack').addEventListener('click',closeSquad);document.getElementById('squadBack').addEventListener('touchstart',function(e){e.preventDefault();closeSquad();});
document.getElementById('btnKick').addEventListener('click',startGame);document.getElementById('btnKick').addEventListener('touchstart',function(e){e.preventDefault();startGame();});
document.getElementById('toGameFromSquad').addEventListener('click',startGame);document.getElementById('toGameFromSquad').addEventListener('touchstart',function(e){e.preventDefault();startGame();});
document.getElementById('homeBtn').addEventListener('click',goHome);document.getElementById('homeBtn').addEventListener('touchstart',function(e){e.preventDefault();goHome();});
document.getElementById('btnUpdateMenu').addEventListener('click',openChat);document.getElementById('btnUpdateMenu').addEventListener('touchstart',function(e){e.preventDefault();openChat();});
let players=[];function getF(L){if(L)return [{x:0.08,y:0.50},{x:0.18,y:0.20},{x:0.18,y:0.40},{x:0.18,y:0.60},{x:0.18,y:0.80},{x:0.32,y:0.30},{x:0.32,y:0.50},{x:0.32,y:0.70},{x:0.48,y:0.25},{x:0.48,y:0.50},{x:0.48,y:0.75}];else return [{x:0.92,y:0.50},{x:0.82,y:0.20},{x:0.82,y:0.40},{x:0.82,y:0.60},{x:0.82,y:0.80},{x:0.68,y:0.30},{x:0.68,y:0.50},{x:0.68,y:0.70},{x:0.52,y:0.25},{x:0.52,y:0.50},{x:0.52,y:0.75}]}
let fA=getF(true),fB=getF(false);for(let i=0;i<11;i++)players.push({team:'A',num:99,x:0,y:0});for(let i=0;i<11;i++)players.push({team:'B',num:99,x:0,y:0});
function resetPos(){fA=getF(true);fB=getF(false);players.forEach((p,i)=>{if(i<11){p.x=W*fA[i].x;p.y=90+(H-260)*fA[i].y}else{p.x=W*fB[i-11].x;p.y=90+(H-260)*fB[i-11].y}});ball={x:W/2,y:H/2,vx:0,vy:0};paused=false;}
function drawField(){ctx.fillStyle='#2e8b4e';ctx.fillRect(0,0,W,H);for(let i=0;i<W;i+=68){ctx.fillStyle=i%136==0?'#33a05a':'#278a4a';ctx.fillRect(i,0,68,H)}ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.strokeRect(W*0.015,88,W*0.97,H-88-170);ctx.beginPath();ctx.moveTo(W/2,88);ctx.lineTo(W/2,H-170);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,80,0,Math.PI*2);ctx.stroke();}
function loop(){drawField();if(!gameStarted||paused){requestAnimationFrame(loop);return;}players.forEach((p,i)=>{ctx.fillStyle=p.team=='A'?'#ffeb3b':'#ef4444';ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill();if(i==sel){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,19,0,Math.PI*2);ctx.stroke();}});ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,Math.PI*2);ctx.fill();requestAnimationFrame(loop);}loop();
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let drag=false,ang=0,pw=0;
function handleMove(e){if(!drag||!gameStarted)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let clientX=e.touches?e.touches[0].clientX:e.clientX,clientY=e.touches?e.touches[0].clientY:e.clientY;let dx=clientX-cx,dy=clientY-cy;pw=Math.min(44,Math.hypot(dx,dy));ang=Math.atan2(dy,dx);stick.style.transform=`translate(calc(-50% + ${Math.cos(ang)*pw}px), calc(-50% + ${Math.sin(ang)*pw}px))`;let sp=(pw/44)*4;players[sel].x+=Math.cos(ang)*sp;players[sel].y+=Math.sin(ang)*sp;if(Math.hypot(ball.x-players[sel].x,ball.y-players[sel].y)<26){ball.x+=Math.cos(ang)*sp;ball.y+=Math.sin(ang)*sp}}
joy.addEventListener('touchstart',function(e){e.preventDefault();drag=true});joy.addEventListener('touchend',function(){drag=false;stick.style.transform='translate(-50%,-50%)';});
joy.addEventListener('touchmove',function(e){e.preventDefault();handleMove(e);});
cv.addEventListener('touchstart',function(e){if(!gameStarted)return;let c=0,d=9999;players.forEach((p,i)=>{if(p.team!='A')return;let dist=Math.hypot(p.x-e.touches[0].clientX,p.y-e.touches[0].clientY);if(dist<d){d=dist;c=i}});if(d<70)sel=c;});
function shoot(p){if(!gameStarted)return;ball.vx=(W*0.92-ball.x)*0.08*p;ball.vy=(Math.random()-0.5)*4;let it=setInterval(function(){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.99;if(ball.x>W-6||ball.x<6){clearInterval(it);if(ball.x>W-6){sA++;document.getElementById('goalPop').classList.add('show');document.getElementById('sc').innerText=`BAN ${sA}-${sB} BRA`;setTimeout(function(){document.getElementById('goalPop').classList.remove('show');resetPos();},1200)}}},16)}
document.getElementById('shoot').addEventListener('touchstart',function(e){e.preventDefault();shoot(1.4)});document.getElementById('shoot').addEventListener('click',function(){shoot(1.4)});
document.getElementById('pass').addEventListener('touchstart',function(e){e.preventDefault();let t=players.filter(p=>p.team=='A'&&p!=players[sel])[0];if(t){ball.vx=(t.x-ball.x)*0.12;ball.vy=(t.y-ball.y)*0.12;}});
const updateBtn=document.getElementById('updateBtn'),chatBox=document.getElementById('chatBox'),chatClose=document.getElementById('chatClose'),chatInput=document.getElementById('chatInput'),chatSend=document.getElementById('chatSend'),chatBody=document.getElementById('chatBody');
function openChat(){chatBox.classList.add('show')}function closeChat(){chatBox.classList.remove('show')}
updateBtn.addEventListener('click',openChat);updateBtn.addEventListener('touchstart',function(e){e.preventDefault();openChat();});
chatClose.addEventListener('click',closeChat);chatClose.addEventListener('touchstart',function(e){e.preventDefault();closeChat();});
function sendUpdate(){let txt=chatInput.value.trim();if(!txt)return;let me=document.createElement('div');me.className='msg me';me.innerText=txt;chatBody.appendChild(me);chatInput.value='';let sys=document.createElement('div');sys.className='msg';sys.innerText='⏳ 5s...';chatBody.appendChild(sys);let c=5;let iv=setInterval(function(){c--;sys.innerText='⏳ Adding... '+c+'s';if(c<=0){clearInterval(iv);sys.innerText='✅ '+txt+' Added!';bench.push({pos:'CF',rat:100,name:txt.substring(0,10),flag:'⭐',icon:'⭐'});renderSquad();document.getElementById('csVal').innerText=parseInt(document.getElementById('csVal').innerText)+20;}},1000);}
chatSend.addEventListener('click',sendUpdate);chatSend.addEventListener('touchstart',function(e){e.preventDefault();sendUpdate();});
R();resetPos();
</script>
</body>
</html>
