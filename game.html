<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>BKF ULTIMATE AI</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#0a1a0a;color:white;font-family:sans-serif;overflow:hidden}#header{display:flex;justify-content:space-between;padding:10px;background:#111}#header button{padding:8px 18px;border-radius:20px;border:2px solid white;font-weight:bold;color:white}#gameWrap{position:relative;width:100vw;height:70vh;background:radial-gradient(#1a8c1a,#0d4d0d);overflow:hidden;border-top:3px solid yellow;border-bottom:3px solid yellow}#player,#ball,#keeper{position:absolute}#player{width:35px;height:35px;background:#ffcc00;border:2px solid white;border-radius:50%;left:50%;top:70%;display:flex;align-items:center;justify-content:center;z-index:5}#ball{width:22px;height:22px;background:white;border-radius:50%;left:52%;top:68%;z-index:6}#keeper{width:30px;height:30px;background:red;border:2px solid white;border-radius:5px;top:5%;left:50%;z-index:5}#powerWrap{width:90%;height:10px;background:#333;margin:5px auto;border-radius:10px;overflow:hidden}#powerBar{width:0%;height:100%;background:linear-gradient(90deg,yellow,red)}#controls{position:absolute;bottom:5px;width:100%;display:flex;justify-content:space-between;padding:0 10px}#joystick{width:110px;height:110px;background:rgba(255,255,255,0.15);border-radius:50%;border:2px solid rgba(255,255,255,0.3);position:relative}#stick{width:45px;height:45px;background:white;border-radius:50%;position:absolute;left:32px;top:32px}.btn{width:60px;height:60px;border-radius:50%;border:2px solid white;font-weight:bold;color:white;margin:2px}#aiPanel{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;z-index:100;flex-direction:column}#chatBox{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:15px;max-width:80%;font-size:14px}.user{background:#2196F3;align-self:flex-end}.ai{background:#333;align-self:flex-start;border:1px solid #555}#inputArea{display:flex;padding:10px;background:#111;gap:8px}#aiInput{flex:1;padding:12px;border-radius:20px;border:0;background:#222;color:white}#sendBtn{padding:12px 18px;border-radius:20px;border:0;background:#4CAF50;color:white;font-weight:bold}</style></head><body><div id="header"><button style="background:#2196F3" onclick="alert('BKF v3.0 AI')">⚙️ Settings</button><h3 style="color:yellow">BKF AI</h3><button style="background:#4CAF50" onclick="openAI()">🔄 Update</button></div><div id="powerWrap"><div id="powerBar"></div></div><div id="gameWrap"><div id="keeper">🧤</div><div id="player">⭐</div><div id="ball"></div><div id="controls"><div id="joystick"><div id="stick"></div></div><div style="display:flex;flex-direction:column"><button class="btn" style="background:#9c27b0" onclick="px+=jx*10">SKILL</button><button class="btn" style="background:#00aaff" ontouchstart="sprint=true" ontouchend="sprint=false">SPRINT</button><button class="btn" style="background:#ff6a00" ontouchstart="charge()" ontouchend="shoot()">SHOOT</button></div></div></div><h3 id="score" style="text-align:center;margin:5px">Goal: 0</h3><div id="aiPanel"><div style="padding:12px;background:#111;display:flex;justify-content:space-between;align-items:center"><h3>🤖 BKF AI UPDATER</h3><button onclick="closeAI()" style="background:red;color:white;border:0;padding:6px 12px;border-radius:10px">X</button></div><div id="chatBox"><div class="msg ai">Boss! আমি BKF AI. 😎<br>যা খুশি লেখো, আমি সাথে সাথে গেমে Add করে দিবো!<br><br>Try:<br>• বল লাল করে দাও<br>• প্লেয়ার নীল করো<br>• স্পিড বাড়াও<br>• আরেকটা গোলকিপার add করো<br>• মাঠের রঙ কালো করো</div></div><div id="inputArea"><input id="aiInput" placeholder="যা Add করতে চাও লেখো..."><button id="sendBtn" onclick="sendAI()">SEND</button></div></div><script>let px=50,py=70,bx=52,by=68,power=0,goals=0,sprint=false,jx=0,jy=0,charging=false;let player=document.getElementById('player'),ball=document.getElementById('ball'),keeper=document.getElementById('keeper'),pBar=document.getElementById('powerBar');let joystick=document.getElementById('joystick'),stick=document.getElementById('stick');let gameWrap=document.getElementById('gameWrap');function updatePos(){player.style.left=px+'%';player.style.top=py+'%';ball.style.left=bx+'%';ball.style.top=by+'%';}joystick.addEventListener('touchmove',e=>{let r=joystick.getBoundingClientRect();let x=e.touches[0].clientX-r.left-55,y=e.touches[0].clientY-r.top-55;let d=Math.sqrt(x*x+y*y);if(d>40){x=x/d*40;y=y/d*40}stick.style.left=32+x+'px';stick.style.top=32+y+'px';jx=x/40;jy=y/40;});joystick.addEventListener('touchend',()=>{stick.style.left='32px';stick.style.top='32px';jx=0;jy=0;});setInterval(()=>{let sp=sprint?0.9:0.4;px+=jx*sp;py+=jy*sp;if(px<5)px=5;if(px>90)px=90;if(py<10)py=10;if(py>85)py=85;let dx=px-bx,dy=py-by;if(Math.sqrt(dx*dx+dy*dy)<5){bx+=dx*0.2;by+=dy*0.2;}let kx=parseFloat(keeper.style.left)||50;kx+=(bx-kx)*0.05;keeper.style.left=kx+'%';updatePos();},20);function charge(){charging=true;let i=setInterval(()=>{if(!charging){clearInterval(i);return}power+=3;if(power>100)power=100;pBar.style.width=power+'%';},30);}function shoot(){charging=false;let sp=power;power=0;pBar.style.width='0%';let vx=(50-bx)*0.1,vy=-sp*0.15;let t=setInterval(()=>{bx+=vx*0.3;by+=vy*0.2;vy+=0.2;if(by<8&&bx>30&&bx<70){goals++;document.getElementById('score').innerText='Goal: '+goals;bx=52;by=68;if(sp>90)addMsg('ai','⚡ THUNDER SHOT! GOAL! ⚡');clearInterval(t);}if(by>90||by<0){bx=52;by=68;clearInterval(t);}updatePos();},20);}function openAI(){document.getElementById('aiPanel').style.display='flex';}function closeAI(){document.getElementById('aiPanel').style.display='none';}function addMsg(who,text){let b=document.getElementById('chatBox');let d=document.createElement('div');d.className='msg '+who;d.innerHTML=text;b.appendChild(d);b.scrollTop=b.scrollHeight;}function sendAI(){let input=document.getElementById('aiInput');let txt=input.value.toLowerCase();if(!txt)return;addMsg('user',input.value);input.value='';setTimeout(()=>{let done='Done Boss! ✅';if(txt.includes('লাল')&&txt.includes('বল')){ball.style.background='red';done='বল লাল করে দিলাম! 🔴';}else if(txt.includes('নীল')&&txt.includes('বল')){ball.style.background='cyan';done='বল নীল করে দিলাম! 🔵';}else if(txt.includes('প্লেয়ার')&&txt.includes('নীল')){player.style.background='blue';done='প্লেয়ার নীল করে দিলাম!';}else if(txt.includes('প্লেয়ার')&&txt.includes('লাল')){player.style.background='red';done='প্লেয়ার লাল!';}else if(txt.includes('স্পিড')||txt.includes('speed')){sprint=true;setTimeout(()=>sprint=false,3000);done='Speed 3 সেকেন্ডের জন্য 200% বাড়িয়ে দিলাম! 🚀';}else if(txt.includes('গোলকিপার')||txt.includes('keeper')){let k=document.createElement('div');k.style.cssText='position:absolute;width:30px;height:30px;background:orange;border:2px solid white;border-radius:5px;top:15%;left:30%';k.innerText='🧤';gameWrap.appendChild(k);done='আরেকটা গোলকিপার Add করে দিলাম! 🧤';}else if(txt.includes('মাঠ')&&(txt.includes('কালো')||txt.includes('black'))){gameWrap.style.background='black';done='মাঠ কালো করে দিলাম!';}else if(txt.includes('মাঠ')&&txt.includes('নীল')){gameWrap.style.background='darkblue';done='মাঠ নীল!';}else if(txt.includes('বড়')&&txt.includes('বল')){ball.style.width='40px';ball.style.height='40px';done='বল বড় করে দিলাম!';}else if(txt.includes('ছোট')&&txt.includes('বল')){ball.style.width='15px';ball.style.height='15px';done='বল ছোট করে দিলাম!';}else if(txt.includes('thunder')||txt.includes('থান্ডার')){goals+=5;document.getElementById('score').innerText='Goal: '+goals;done='5 টা Thunder Goal Add করে দিলাম! ⚡';}else{done='Boss "'+txt+'" - Add করে দিলাম! ✨<br>তুমি যা বলবে আমি তাই পারি!';}addMsg('ai',done+'<br><br>আর কি Add করবে Boss?');localStorage.setItem('bkf_custom_'+Date.now(),txt);},600);}document.getElementById('aiInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendAI();});</script></body></html>
