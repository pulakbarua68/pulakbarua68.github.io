<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BKF ULTRA - THROW IN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;height:100vh;overflow:hidden;font-family:Arial}
#wrap{position:relative;width:100%;height:100vh;background:#0a1628;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.top{position:absolute;top:0;left:0;right:0;height:54px;background:#0e1f3f;display:flex;justify-content:flex-end;gap:10px;align-items:center;padding:0 12px;z-index:20;border-bottom:3px solid #facc15}
.ibtn{width:52px;height:38px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ad{position:absolute;top:54px;left:0;right:0;height:22px;background:linear-gradient(90deg,#ff00ff,#00eaff,#ff00ff);z-index:15;display:flex;align-items:center;overflow:hidden;color:#fff;font-weight:900;font-size:12px}
.ad span{animation:marq 8s linear infinite;white-space:nowrap}
@keyframes marq{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.hud{position:absolute;top:84px;left:8px;right:8px;background:rgba(0,0,0,0.88);border:1px solid #facc15;border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;color:#facc15;font-size:12px;font-weight:800;z-index:15}
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);background:#facc15;color:#000;font-size:38px;font-weight:900;padding:10px 28px;border-radius:18px;z-index:99;transition:0.4s;box-shadow:0 0 40px #facc15;text-align:center}
.pop.show{transform:translate(-50%,-50%) scale(1)}
#goalPop{font-size:48px;background:linear-gradient(180deg,#ffeb3b,#facc15)}
#throwPop{background:#fff;color:#e11d48;font-size:26px}
.btm{position:absolute;bottom:0;left:0;right:0;height:175px;background:linear-gradient(0deg,#000 65%,transparent);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px 12px;z-index:15}
.joy{width:126px;height:126px;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.25);border-radius:50%;position:relative}
.stick{position:absolute;left:50%;top:50%;width:56px;height:56px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.grid{display:grid;grid-template-columns:74px 74px;gap:12px}
.b{width:74px;height:74px;border-radius:50%;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:10px;box-shadow:0 5px 18px rgba(0,0,0,0.7)}
.b:active{transform:scale(0.92)}.b b{font-size:22px}
.b1{background:linear-gradient(180deg,#a78bfa,#6d28d9)}.b2{background:linear-gradient(180deg,#38bdf8,#0284c7)}.b3{background:linear-gradient(180deg,#4ade80,#15803d)}.b4{background:linear-gradient(180deg,#fb923c,#c2410c)}
#mainMenu{position:absolute;left:0;top:0;width:100%;height:100%;z-index:200;background:radial-gradient(circle at top,#1e3a8a,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:0.5s}
#mainMenu.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.logo{font-size:52px;font-weight:900;color:#facc15;text-shadow:0 0 20px #facc15,0 4px 0 #000;letter-spacing:2px;margin-bottom:6px}
.sublogo{color:#fff;font-size:14px;letter-spacing:6px;font-weight:800;margin-bottom:30px}
.menuBtn{width:260px;padding:16px;background:linear-gradient(180deg,#facc15,#eab308);color:#000;font-weight:900;font-size:18px;border-radius:16px;border:3px solid #fff;margin:8px 0;text-align:center;box-shadow:0 6px 20px rgba(250,204,21,0.5)}
.menuBtn.sec{background:linear-gradient(180deg,#1e293b,#0f172a);color:#fff;border:2px solid rgba(255,255,255,0.3)}
.teamRow{display:flex;gap:12px;margin:18px 0}
.team{width:110px;padding:10px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:14px;text-align:center;color:#fff;font-weight:800}
.team.active{border-color:#facc15;background:rgba(250,204,21,0.2);color:#facc15}
</style>
</head>
<body>
<div id="wrap">
<div id="mainMenu">
<div class="logo">BKF ULTRA</div>
<div class="sublogo">eFOOTBALL 2025</div>
<div class="teamRow"><div class="team active">🇧🇩 BAN</div><div class="team">🇧🇷 BRA</div></div>
<div class="menuBtn" id="playBtn">▶️ KICK OFF</div>
<div class="menuBtn sec" onclick="document.getElementById('mainMenu').classList.add('hide');gameStarted=true;resetPos()">⚙️ TRAINING</div>
</div>
<div class="top"><div class="ibtn" id="homeBtn">🏠</div><div class="ibtn">⏸️</div></div>
<div class="ad"><span>⚽ BKF ULTRA - PLAY CRAZY @FOOTBALL ⚽ THROW-IN ADDED ⚽</span></div>
<canvas id="c"></canvas>
<div class="pop" id="goalPop">GOOOAL!!!</div>
<div class="pop" id="throwPop">THROW-IN</div>
<div class="hud"><span>💰 101499</span><span style="color:#22c55e">OVR 99</span><span style="color:#a78bfa">LVL 99</span><span id="sc">BAN 1-1 BRA</span></div>
<div class="btm">
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="grid">
<div class="b b1">BICYCLE<b>🤸</b></div>
<div class="b b2" id="sprint">SPRINT<b>💨</b></div>
<div class="b b3" id="pass">PASS<b>↗️</b></div>
<div class="b b4" id="shoot">SHOOT<b>⚽</b></div>
</div>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;
function R(){W=cv.width=innerWidth;H=cv.height=innerHeight}R();addEventListener('resize',R);
let sA=1,sB=1,sel=0,gameStarted=false,paused=false;
let ball={x:W/2,y:H/2,vx:0,vy:0};
function getFormation(L){if(L)return [{x:0.08,y:0.50},{x:0.18,y:0.20},{x:0.18,y:0.40},{x:0.18,y:0.60},{x:0.18,y:0.80},{x:0.32,y:0.30},{x:0.32,y:0.50},{x:0.32,y:0.70},{x:0.48,y:0.25},{x:0.48,y:0.50},{x:0.48,y:0.75}];else return [{x:0.92,y:0.50},{x:0.82,y:0.20},{x:0.82,y:0.40},{x:0.82,y:0.60},{x:0.82,y:0.80},{x:0.68,y:0.30},{x:0.68,y:0.50},{x:0.68,y:0.70},{x:0.52,y:0.25},{x:0.52,y:0.50},{x:0.52,y:0.75}]}
let players=[],fA=getFormation(true),fB=getFormation(false);
for(let i=0;i<11;i++)players.push({team:'A',num:[1,2,5,4,3,6,8,10,7,11,9][i],x:0,y:0});
for(let i=0;i<11;i++)players.push({team:'B',num:[1,2,5,4,3,6,8,10,7,11,9][i],x:0,y:0});
function resetPos(){fA=getFormation(true);fB=getFormation(false);players.forEach((p,i)=>{if(i<11){p.x=W*fA[i].x;p.y=90+(H-270)*fA[i].y}else{p.x=W*fB[i-11].x;p.y=90+(H-270)*fB[i-11].y}});ball={x:W/2,y:(H-90)/2+20,vx:0,vy:0};paused=false;}
function drawField(){
 ctx.fillStyle='#2e8b4e';ctx.fillRect(0,76,W,H);
 for(let i=0;i<W;i+=68){ctx.fillStyle=i%136==0?'#33a05a':'#278a4a';ctx.fillRect(i,76,68,H)}
 ctx.strokeStyle='#fff';ctx.lineWidth=2.8;ctx.strokeRect(W*0.015,88,W*0.97,H-88-175);
 ctx.beginPath();ctx.moveTo(W/2,88);ctx.lineTo(W/2,H-175);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,(H-87)/2,90,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W/2,(H-87)/2,5,0,Math.PI*2);ctx.fill();
 ctx.lineWidth=3;ctx.strokeRect(0,(H-87)/2-50,W*0.09,100);ctx.strokeRect(W-W*0.09,(H-87)/2-50,W*0.09,100);
}
function loop(){
 drawField();
 if(!gameStarted){requestAnimationFrame(loop);return;}
 if(paused){requestAnimationFrame(loop);return;}
 ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+9,12,5,0,0,Math.PI*2);ctx.fill();
 players.forEach((p,i)=>{
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(p.x,p.y+11,11,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=p.team=='A'?'#ffeb3b':'#ef4444';ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=p.team=='A'?'#1e3a8a':'#fff';ctx.fillRect(p.x-7,p.y-10,14,11);
  ctx.fillStyle=p.team=='A'?'#fff':'#000';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(p.num,p.x,p.y-1);
  if(i==sel){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,20,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffeb3b';ctx.setLineDash([5,5]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,27,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
 });
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ball.x-2,ball.y-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x+2.5,ball.y+1.5,2,0,Math.PI*2);ctx.fill();
 requestAnimationFrame(loop)
}loop();
document.getElementById('playBtn').addEventListener('click',()=>{resetPos();document.getElementById('mainMenu').classList.add('hide');gameStarted=true;});
document.getElementById('homeBtn').addEventListener('click',()=>{gameStarted=false;document.getElementById('mainMenu').classList.remove('hide')});
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let drag=false,ang=0,pw=0;
joy.addEventListener('touchstart',()=>drag=true);joy.addEventListener('touchend',()=>{drag=false;stick.style.transform='translate(-50%,-50%)';pw=0});
joy.addEventListener('touchmove',e=>{
 if(!drag||!gameStarted||paused)return;e.preventDefault();
 let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.touches[0].clientX-cx,dy=e.touches[0].clientY-cy;pw=Math.min(44,Math.hypot(dx,dy));ang=Math.atan2(dy,dx);
 stick.style.transform=`translate(calc(-50% + ${Math.cos(ang)*pw}px), calc(-50% + ${Math.sin(ang)*pw}px))`;
 let sp=(pw/44)*4;players[sel].x+=Math.cos(ang)*sp;players[sel].y+=Math.sin(ang)*sp;
 players[sel].x=Math.max(16,Math.min(W-16,players[sel].x));players[sel].y=Math.max(90,Math.min(H-185,players[sel].y));
 if(Math.hypot(ball.x-players[sel].x,ball.y-players[sel].y)<28){ball.x+=Math.cos(ang)*sp*0.95;ball.y+=Math.sin(ang)*sp*0.95}
},{passive:false});
cv.addEventListener('touchstart',e=>{
 if(!gameStarted)return;
 let c=0,d=9999;players.forEach((p,i)=>{if(p.team!='A')return;let dist=Math.hypot(p.x-e.touches[0].clientX,p.y-e.touches[0].clientY);if(dist<d){d=dist;c=i}});if(d<70)sel=c;
});
function shoot(p=1){if(!gameStarted||paused)return;ball.vx=(W*0.92-ball.x)*0.085*p+(Math.random()-0.5)*2;ball.vy=(Math.random()-0.5)*5*p;let it=setInterval(()=>{if(paused)return;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.994;ball.vy*=0.99;checkOut();if(ball.x<0||ball.x>W)clearInterval(it)},16)}
function checkOut(){
 let gy=(H-87)/2;
 if(ball.y>gy-50&&ball.y<gy+50){
  if(ball.x<=6){sB++;goal()}
  if(ball.x>=W-6){sA++;goal()}
  return;
 }
 if(ball.y<=88){doThrow('THROW-IN',ball.x,92)}
 else if(ball.y>=H-175){doThrow('THROW-IN',ball.x,H-180)}
 else if(ball.x<=W*0.015){doThrow('CORNER',W*0.08, ball.y<gy? 110 : H-200)}
 else if(ball.x>=W*0.985){doThrow('GOAL KICK',W*0.92, (H-87)/2)}
}
function doThrow(type,x,y){
 if(paused)return;
 paused=true;ball.vx=0;ball.vy=0;
 let pop=document.getElementById('throwPop');
 pop.innerText=type;pop.classList.add('show');
 setTimeout(()=>{
  pop.classList.remove('show');
  ball.x=x;ball.y=y;
  let nearest=players.filter(p=>p.team=='B').sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];
  if(nearest){nearest.x=x+(type=='CORNER'?-18:0);nearest.y=y}
  paused=false;
  setTimeout(()=>{if(type=='THROW-IN'){ball.vx=(players[sel].x-ball.x)*0.12;ball.vy=(players[sel].y-ball.y)*0.12;let it=setInterval(()=>{ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.96;ball.vy*=0.96;if(Math.hypot(ball.vx,ball.vy)<0.7)clearInterval(it)},16)}},400);
 },1200);
}
function goal(){paused=true;document.getElementById('goalPop').classList.add('show');document.getElementById('sc').innerText=`BAN ${sA}-${sB} BRA`;setTimeout(()=>{document.getElementById('goalPop').classList.remove('show');ball.x=W/2;ball.y=(H-87)/2+20;ball.vx=0;ball.vy=0;paused=false},1800)}
document.getElementById('shoot').addEventListener('touchstart',()=>shoot(1.4));
document.getElementById('pass').addEventListener('touchstart',()=>{if(!gameStarted||paused)return;let t=players.filter(p=>p.team=='A'&&p!=players[sel]).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];if(t){ball.vx=(t.x-ball.x)*0.13;ball.vy=(t.y-ball.y)*0.13;let it=setInterval(()=>{ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.96;ball.vy*=0.96;checkOut();if(Math.hypot(ball.vx,ball.vy)<0.7)clearInterval(it)},16)}});
setInterval(()=>{if(!gameStarted||paused)return;players.forEach(p=>{if(p.team=='B'){let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);if(d<250){p.x+=dx*0.016;p.y+=dy*0.016;if(d<20)ball.x+=dx*0.12}}})},30);
R();resetPos();
</script>
</body>
</html>
